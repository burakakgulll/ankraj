<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2126">
<title>Ankraj plakaları – TRİBÜN ANKRAJ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<style>
:root{
  --paper:#F4F5F3; --surface:#FFFFFF; --ink:#1C2126; --muted:#5B6570; --line:#D5D9DD;
  --slab:#E3E6E8; --accent:#FFC400; --accent-ink:#1C2126; --ok:#12804A; --warn:#B3261E;
  --sA:#C62828; --sB:#1F5FD6;
  --t48:#4C8BF5; --t49:#F29D38; --t50:#2EAD5B; --t51:#A35BD6; --t90:#E0483E;
  --g0:#D62728; --g1:#2CA02C; --g2:#3A4048;
  --bar:#1C2126; --bar-ink:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181C; --surface:#1D2329; --ink:#ECEFF1; --muted:#9AA4AE; --line:#343C44;
    --slab:#232A31; --g2:#C9CED3; --bar:#0E1114; --bar-ink:#ECEFF1; --sB:#5B8FF0; --sA:#EF5350;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181C; --surface:#1D2329; --ink:#ECEFF1; --muted:#9AA4AE; --line:#343C44;
  --slab:#232A31; --g2:#C9CED3; --bar:#0E1114; --bar-ink:#ECEFF1; --sB:#5B8FF0; --sA:#EF5350;
  color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--bar);color:var(--bar-ink);padding:10px 14px;display:flex;align-items:baseline;gap:10px;flex:none}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
header span{font-size:13px;opacity:.7}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* ---------- PLAN ---------- */
#v-plan{flex-direction:column}
.rule{background:var(--accent);color:var(--accent-ink);font-size:14px;padding:7px 14px;flex:none;line-height:1.35}
.rule b{font-weight:700}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.mapwrap{flex:1;min-width:0;min-height:0;position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block;cursor:grab}
#map text{font-family:inherit;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.turn{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
@media (orientation:landscape){.turn{display:none}}
.stage:has(.panel:not(.empty)) .turn{display:none}

.panel{flex:none;background:var(--surface);border-top:1px solid var(--line);height:42%;overflow:auto;padding:14px 16px 18px;position:relative}
.panel.empty{height:auto}
@media (orientation:landscape) and (min-width:600px){
  .stage{flex-direction:row}
  .panel{height:auto;width:340px;border-top:0;border-left:1px solid var(--line)}
  .panel.empty{width:240px}
  .panel .pbody{grid-template-columns:1fr}
  .panel .pbody .mini{order:-1;max-width:150px}
}
.hint{color:var(--muted);font-size:15px;margin:0}
.hint b{color:var(--ink)}
.close{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--muted)}
.ptitle{display:flex;align-items:center;gap:10px;margin:0 44px 10px 0}
.chip{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.35);flex:none}
.ptitle h2{font-size:22px;margin:0;line-height:1.1}
.ptitle small{font-size:14px;color:var(--muted);display:block;font-weight:400}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 12px;font-size:15.5px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:700;font-size:17px}
dl.facts dd small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.big{font-size:20px;font-weight:700}
.mini{display:block;width:100%;max-width:220px;height:auto;margin:4px auto 10px}
.pbody{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:start}
.pbody .mini{margin:0}
dl.facts{grid-template-columns:auto 1fr}
.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14.5px;margin:4px 0 10px}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plist button{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:14.5px}
.plist .chip{width:14px;height:14px}

/* ---------- LİSTE / POZ / GÖNYE ---------- */
.scroll{flex:1;overflow:auto;padding:14px 14px 28px;-webkit-overflow-scrolling:touch}
.scroll>*{max-width:760px;margin-left:auto;margin-right:auto}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.row h3{margin:0;font-size:15px;padding:9px 12px;background:color-mix(in srgb,var(--accent) 35%,var(--surface));display:flex;justify-content:space-between;gap:8px}
.row h3 span{font-weight:400;color:var(--ink);opacity:.75}
.item{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .go{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;min-height:44px}
.item .go b{min-width:28px}
.item .go .meta{color:var(--muted);font-size:14px}
.item .go .dg{margin-left:auto;font-weight:700;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
.card p{margin:2px 0;font-size:14.5px;color:var(--muted)}
.card .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.card .pair figure{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.card .note{color:var(--warn);font-weight:600;font-size:14px;margin-top:6px}
.lead{font-size:15px;color:var(--muted);margin:0 0 12px}
.gtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gtable th{text-align:left;font-size:14px;padding:9px 12px;background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.gtable td{padding:9px 12px;border-top:1px solid var(--line);font-size:15px}
.gtable td:first-child{font-weight:700;width:52px}
.gtable td:last-child{text-align:right;font-weight:700;font-size:16px}
.gtable td.sub{color:var(--muted);font-size:14px}
#gsvg{width:100%;height:auto;display:block;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* ---------- TAB BAR ---------- */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar)}
nav button{background:none;border:0;color:var(--bar-ink);opacity:.65;padding:10px 2px 11px;font-size:14px;font-weight:600;min-height:52px;border-top:3px solid transparent}
nav button[aria-selected="true"]{opacity:1;border-top-color:var(--accent)}
@media (max-height:500px){header{display:none}.rule{font-size:12.5px;padding:4px 12px}nav button{min-height:40px;padding:6px 2px}.panel .pbody .mini{max-width:100px}.ptitle h2{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.panel{transition:height .18s ease}}
</style>
</head>
<body>
<header><h1>Ankraj plakaları</h1><span>TRİBÜN ANKRAJ, 45 plaka</span></header>
<main>
  <section class="view on" id="v-plan" aria-label="Plan">
    <div class="rule">Siyah nokta iplerin kesiştiği yere gelir. <b>Plaka oradan yukarı ve binanın ortasına doğru açılır.</b></div>
    <div class="stage">
      <div class="mapwrap">
        <svg id="map" role="img" aria-label="Ankraj yerleşim planı"></svg>
        <div class="zoom">
          <button id="zin" aria-label="Yakınlaştır">+</button>
          <button id="zout" aria-label="Uzaklaştır">−</button>
          <button id="zfit" aria-label="Tümünü göster" style="font-size:17px">⤢</button>
        </div>
        <div class="turn">Daha geniş görmek için telefonu yan çevirin</div>
      </div>
      <aside class="panel empty" id="panel" aria-live="polite"></aside>
    </div>
  </section>
  <section class="view" id="v-list" aria-label="Sıralar"><div class="scroll" id="listbox"></div></section>
  <section class="view" id="v-types" aria-label="Pozlar"><div class="scroll" id="typebox"></div></section>
  <section class="view" id="v-gonye" aria-label="Gönye"><div class="scroll" id="gonyebox"></div></section>
</main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="plan">Plan</button>
  <button role="tab" aria-selected="false" data-v="list">Sıralar</button>
  <button role="tab" aria-selected="false" data-v="types">Pozlar</button>
  <button role="tab" aria-selected="false" data-v="gonye">Gönye</button>
</nav>

function hiLine(x1,y1,x2,y2){
  el('line',{x1,y1,x2,y2,stroke:'var(--ink)','stroke-width':6,'vector-effect':'non-scaling-stroke','stroke-linecap':'round'},gHi);
  el('line',{x1,y1,x2,y2,stroke:'var(--accent)','stroke-width':3.5,'vector-effect':'non-scaling-stroke','stroke-linecap':'round'},gHi);
}
function hiString(ax,i){
  if(ax==='x'){const g=D.GX[i];hiLine(g,450,g,-7450);} else {const g=D.GY[i];hiLine(-450,-g,16080,-g);}
}
function dimOthers(keep){plates.forEach((pl,i)=>pl.g.style.opacity=keep.has(i)?'':'.3');strX.concat(strY).forEach(s=>s.style.opacity='.35');}
function closeBtn(){return '<button class="close" aria-label="Kapat" onclick="clearSel()">×</button>';}

function plateMini(p,big){
  // plaka çizimi: oturan köşe orijinde, ipler kesikli
  const s=p.s==='L'?1:-1, ox=p.s==='L'?D.GX[p.xi]:D.GX[p.xi], oy=D.GY[p.yi];
  const m=Math.max(p.w,p.h), mg=big?300:200, W=m+130+mg;
  const vb=p.s==='L'?`${-mg} ${-(m+120)} ${W} ${W}`:`${-(m+130)} ${-(m+120)} ${W} ${W}`;
  let h=`<svg class="mini" viewBox="${vb}" ${big?'':'width="200"'} aria-hidden="true">`;
  h+=`<line x1="${-140*s}" y1="0" x2="${(Math.max(p.w,p.h)+60)*s}" y2="0" stroke="${GCOL(p.yi)}" stroke-width="5" stroke-dasharray="16 10"/>`;
  h+=`<line x1="0" y1="140" x2="0" y2="${-(Math.max(p.w,p.h)+60)}" stroke="${GCOL(p.xi)}" stroke-width="5" stroke-dasharray="16 10"/>`;
  h+=`<polygon points="${p.v.map(v=>(v[0]-ox)+','+(-(v[1]-oy))).join(' ')}" fill="${TCOL(p.t)}" stroke="currentColor" stroke-width="4"/>`;
  p.b.forEach(b=>h+=`<circle cx="${b[0]-ox}" cy="${-(b[1]-oy)}" r="15" fill="#fff" stroke="currentColor" stroke-width="2"/>`);
  h+=`<circle cx="0" cy="0" r="24" fill="#000" stroke="var(--accent)" stroke-width="6"/>`;
  h+=`<text x="${-30*s}" y="62" font-size="44" fill="currentColor" text-anchor="${s>0?'end':'start'}" font-weight="700">${big?'y ipi':'y'+(p.yi+1)}</text>`;
  h+=`<text x="${18*s}" y="${-(Math.max(p.w,p.h)+10)}" font-size="44" fill="currentColor" text-anchor="${s>0?'start':'end'}" font-weight="700">${big?'x ipi':'x'+(p.xi+1)}</text>`;
  return h+'</svg>';
}
function selectPlate(i,zoom){
  selection={kind:'plate',i}; clearHi();
  const p=D.P[i], pl=plates[i];
  hiString('x',p.xi); hiString('y',p.yi);
  const ox=p.s==='L'?0:X;
  el('line',{x1:ox,y1:0,x2:pl.rx,y2:-pl.ry,stroke:p.s==='L'?'var(--sA)':'var(--sB)','stroke-width':2.5,'stroke-dasharray':'7 5','vector-effect':'non-scaling-stroke'},gTop);
  const c=el('circle',{cx:ox,cy:0,r:60,fill:p.s==='L'?'var(--sA)':'var(--sB)'},gTop); hiScale.push({e:c,attr:'r',px:7});
  dimOthers(new Set([i]));
  gPl.appendChild(pl.g);
  const from=p.s==='L'?'A':'B';
  panel.className='panel';
  panel.innerHTML=closeBtn()+
   `<div class="ptitle"><span class="chip" style="background:${TCOL(p.t)}"></span><h2>Poz ${p.t}<small>${TN[p.t]}, ${p.b.length} delik</small></h2></div>`+
   `<div class="pbody"><dl class="facts num">
     <dt>Oturan köşe</dt><dd>${SIDE[p.s]}</dd>
     <dt>x ipi</dt><dd>x${p.xi+1}<small>x1'den ${fmt(D.GXr[p.xi])} mm</small></dd>
     <dt>y ipi</dt><dd>y${p.yi+1}<small>y1'den ${fmt(D.GYr[p.yi])} mm</small></dd>
     <dt>Çapraz</dt><dd>${p.d?`<span class="big" style="color:${p.s==='L'?'var(--sA)':'var(--sB)'}">${fmt(p.d)} mm</span><small>${from} noktasından siyah noktaya</small>`:`<span style="color:${p.s==='L'?'var(--sA)':'var(--sB)'}">Siyah nokta tam ${from} noktasında</span>`}</dd>
   </dl>${plateMini(p)}</div>`+
   (p.t==='90'?'<div class="warn">Uzun kenar (350) bina boyunca, x yönünde.</div>':'')+
   (p.s==='R'&&(p.t==='50'||p.t==='51')?'<div class="warn">Sol yarıdaki plakanın ters çevrilmiş hali.</div>':'');
  if(zoom){const b=pl.bb; centerOn((b.x0+b.x1)/2,-(b.y0+b.y1)/2,Math.max(view.s,0.09));} else render();
}
function selectString(ax,i){
  selection={kind:'string',ax,i}; clearHi(); hiString(ax,i);
  const on=D.P.map((p,k)=>[p,k]).filter(([p])=>ax==='x'?p.xi===i:p.yi===i);
  dimOthers(new Set(on.map(o=>o[1])));
  const G=ax==='x'?D.GXr:D.GYr; const raw=ax==='x'?D.GX:D.GY;
  const near=[];[i-1,i+1].forEach(j=>{if(j>=0&&j<G.length){const d=Math.abs(raw[j]-raw[i]);if(d<60)near.push(`${ax}${j+1} ipi sadece ${Math.round(d)} mm yanında. Çivi etiketine bakın.`);}});
  panel.className='panel';
  panel.innerHTML=closeBtn()+
   `<div class="ptitle"><span class="chip" style="background:${GCOL(i)};border-radius:50%"></span><h2>${ax}${i+1} ipi<small>${ax}1'den ${fmt(G[i])} mm</small></h2></div>`+
   near.map(n=>`<div class="warn">${n}</div>`).join('')+
   `<p class="hint" style="margin-bottom:4px">Bu ipe oturan plakalar (${on.length}):</p><div class="plist">`+
   on.map(([p,k])=>`<button onclick="selectPlate(${k},true)"><span class="chip" style="background:${TCOL(p.t)}"></span><b>${p.t}</b> ${ax==='x'?'y'+(p.yi+1):'x'+(p.xi+1)}</button>`).join('')+'</div>';
  render();
}

/* ---------- SIRALAR ---------- */
function buildList(){
  const box=$('#listbox');
  let h='<p class="lead">Satıra dokunun, plaka planda gösterilir.</p>';
  D.GY.forEach((g,yi)=>{
    const rows=D.P.map((p,k)=>[p,k]).filter(([p])=>p.yi===yi); if(!rows.length) return;
    h+=`<div class="row"><h3><b>y${yi+1} ipi</b><span class="num">y1'den ${fmt(D.GYr[yi])} mm</span></h3>`;
    rows.forEach(([p,k])=>{
      h+=`<div class="item"><button class="go" onclick="showOnPlan(${k})"><span class="chip" style="background:${TCOL(p.t)}"></span><b>${p.t}</b><span class="meta">x${p.xi+1}, ${SIDE[p.s]}</span><span class="dg num" style="color:${p.s==='L'?'var(--sA)':'var(--sB)'}">${p.d?(p.s==='L'?'A ':'B ')+fmt(p.d):(p.s==='L'?'A noktası':'B noktası')}</span></button></div>`;
    });
    h+='</div>';
  });
  box.innerHTML=h;
}
function showOnPlan(k){tab('plan');requestAnimationFrame(()=>selectPlate(k,true));}

/* ---------- POZLAR ---------- */
function buildTypes(){
  let h='<p class="lead">Siyah nokta, iplerin kesiştiği köşedir. Pahlı plakalarda kesik köşe her zaman yukarıya ve binanın ortasına bakar.</p><div class="cards">';
  ['48','90','49','50','51'].forEach(t=>{
    const L=D.P.find(p=>p.t===t&&p.s==='L'), R=D.P.find(p=>p.t===t&&p.s==='R');
    const nL=D.P.filter(p=>p.t===t&&p.s==='L').length, nR=CNT[t]-nL;
    h+=`<div class="card"><h3><span class="chip" style="background:${TCOL(t)}"></span>Poz ${t}</h3><p class="num">${TN[t]}, ${L.b.length} delik, ${CNT[t]} adet</p>`+
       `<div class="pair"><figure>${plateMini(L,true)}Sol yarı (${nL})</figure><figure>${plateMini(R,true)}Sağ yarı (${nR})</figure></div>`+
       (t==='90'?'<div class="note">Uzun kenar (350) x yönünde.</div>':'')+
       (t==='50'||t==='51'?'<div class="note">Sağ yarıdaki, soldakinin ters çevrilmiş hali.</div>':'')+'</div>';
  });
  $('#typebox').innerHTML=h+'</div>';
}

/* ---------- GÖNYE ---------- */
function buildGonye(){
  const F=D.F, XM=D.GX[15];
  let s=`<svg id="gsvg" viewBox="-1500 -8500 18700 10000" aria-label="Dış çerçeve ve çaprazlar">`;
  D.GX.forEach(g=>s+=`<line x1="${g}" y1="250" x2="${g}" y2="${-Y-250}" stroke="var(--line)" stroke-width="18"/>`);
  D.GY.forEach(g=>s+=`<line x1="-250" y1="${-g}" x2="${X+250}" y2="${-g}" stroke="var(--line)" stroke-width="18"/>`);
  s+=`<rect x="0" y="${-Y}" width="${X}" height="${Y}" fill="none" stroke="currentColor" stroke-width="55"/>`;
  s+=`<line x1="${XM}" y1="300" x2="${XM}" y2="${-Y-300}" stroke="currentColor" stroke-width="35" stroke-dasharray="160 100"/>`;
  s+=`<line x1="0" y1="0" x2="${X}" y2="${-Y}" stroke="var(--sA)" stroke-width="60"/><line x1="${X}" y1="0" x2="0" y2="${-Y}" stroke="var(--sB)" stroke-width="60"/>`;
  [[0,0,'A',-350,500],[X,0,'B',350,500],[X,-Y,'C',350,-250],[0,-Y,'D',-350,-250],[XM,0,'E',0,650],[XM,-Y,'F',0,-350]].forEach(([x,y,n,dx,dy])=>{
    s+=`<circle cx="${x}" cy="${y}" r="150" fill="#000" stroke="var(--accent)" stroke-width="40"/><text x="${x+dx}" y="${y+dy}" font-size="760" font-weight="800" fill="currentColor" text-anchor="middle">${n}</text>`;});
  s+=`<text x="${X*0.27}" y="${-Y*0.27-180}" font-size="640" font-weight="700" fill="var(--sA)" text-anchor="middle" transform="rotate(-24 ${X*0.27} ${-Y*0.27-180})">AC ${fmt(F.AC)}</text>`;
  s+=`<text x="${X*0.73}" y="${-Y*0.27-180}" font-size="640" font-weight="700" fill="var(--sB)" text-anchor="middle" transform="rotate(24 ${X*0.73} ${-Y*0.27-180})">BD ${fmt(F.AC)}</text>`;
  s+='</svg>';
  const T=(title,rows)=>`<table class="gtable num"><tr><th colspan="3">${title}</th></tr>`+rows.map(r=>`<tr><td>${r[0]}</td><td class="sub">${r[1]}</td><td>${fmt(r[2])}</td></tr>`).join('')+'</table>';
  let h='<p class="lead">Diğer iplere geçmeden önce dış çerçeve (x1, x31, y1, y18) ve orta aks (x16) kontrol edilir. Ölçüler mm, ip kesişimleri arası.</p>'+s+
   T('1. Dış kenarlar',[['AB','y1 üstünde, x1 → x31',X],['DC','y18 üstünde, x1 → x31',X],['AD','x1 üstünde, y1 → y18',Y],['BC','x31 üstünde, y1 → y18',Y]])+
   T('2. Çaprazlar (ikisi eşit olmalı)',[['AC','A köşesinden C köşesine',F.AC],['BD','B köşesinden D köşesine',F.AC]])+
   T('3. Orta aks x16 (E ve F)',[['AE','y1 üstünde, x1 → x16',F.XM],['DF','y18 üstünde, x1 → x16',F.XM],['AF','sol yarı çaprazı',F.AF],['DE','sol yarı çaprazı',F.AF],['EC','sağ yarı çaprazı',F.EC],['BF','sağ yarı çaprazı',F.EC]]);
  $('#gonyebox').innerHTML=h;
}

/* ---------- sekmeler ---------- */
function tab(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='plan') requestAnimationFrame(render);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.v));
let fitted=false;
new ResizeObserver(()=>{if(!fitted){fit();fitted=true;}else render();}).observe(svg);
hint(); buildList(); buildTypes(); buildGonye();
</script>
